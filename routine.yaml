# スキンケアルーティンの正本。ここを書き換えて push すると、ページと PDF・画像が作り直される。
# 手順(steps)の書き方:
#   - 文字だけ:            "洗顔"
#   - 補足つき:            {text: "極潤", note: "水分を入れる"}
#   - 始める日があるもの:  {text: "GGエッセンス", from: 2026-11-14}
#     (その日より前は「11/14から」の印が付く。過ぎたら印は消える)

title: スキンケアルーティン
since: 2026-08
updated: 2026-11-06

rule: 攻めもの(リードルショット・酸・レチノール)は1晩に1種類だけ。同じ夜に重ねない

layering:
  order: [攻めもの, 極潤(水分を入れる), GGエッセンス, フタ(クリーミーなもの)]
  note: >-
    水っぽいものが先、クリーミーなものが後。極潤は「水分を入れる係」、フタは「入れた水分が逃げないようにする係」。
    フタはその夜に合う方を1つだけ(重ねても効果は増えず、ベタつくだけ)。

lids:
  - kind: 鎮静のフタ
    items: Scinic シカフルイド or カクタスジェル(同じ役割・好みで)
    feel: さっぱり・肌を落ち着かせる(ジェルは夏向き)
    when: リードルショットの夜と、ベタつきたくない夜
  - kind: 保湿のフタ
    items: Advanced Clinicals ヒアルロン酸クリーム(HAクリーム)
    feel: クリーミー・保湿力が高い
    when: 酸・レチノールの夜と、肌が乾いていると感じる夜

# 夜の種類。color は rs / acid / retinol / rest のどれか
nights:
  rs:
    name: リードルショットの夜
    short: RS
    color: rs
    steps:
      - 洗顔
      - {text: リードルショット100 を顔全体に押し込む, note: チクチクは正常・こすらない}
      - 極潤
      - {text: GGエッセンス, from: 2026-11-14}
      - シカフルイドでフタ
    why: 針状成分の刺激を鎮めるのが最優先なので、フタはシカ。
  acid_nose:
    name: 酸の夜(鼻だけ)
    short: 酸・鼻
    color: acid
    steps:
      - 洗顔
      - {text: Stridex のパッドで鼻・小鼻だけ拭く, note: 顔全体はNG}
      - 極潤
      - {text: GGエッセンス, from: 2026-11-14}
      - HAクリームでフタ
    why: 酸を使った夜は乾燥しやすいので、保湿力の高いフタで守る。
  acid_face:
    name: 酸の夜(顔全体)
    short: 酸・顔全体
    color: acid
    steps:
      - 洗顔
      - {text: Some By Mi ミラクルトナーを顔全体に, note: 頬の毛穴にも酸を届ける}
      - 極潤
      - {text: GGエッセンス, from: 2026-11-14}
      - HAクリームでフタ
    why: Stridex は強いので鼻だけ。頬はマイルドなトナーで。ヒリついたら頬はやめて鼻だけに戻す。
  retinol:
    name: レチノールの夜
    short: レチノール
    color: retinol
    steps:
      - 洗顔
      - 極潤
      - {text: GGエッセンス, from: 2026-11-14}
      - {text: レチノール(Advanced Clinicals)をパール粒1つ分, note: 目のキワ・小鼻の溝は避ける}
      - HAクリームでフタ
    why: レチノールだけは極潤の「後」。先に水分を入れておくと刺激がやわらぐ(バッファ法)。
  rest:
    name: 休みの夜(回復日)
    short: 休み
    color: rest
    steps:
      - 洗顔
      - 極潤
      - {text: GGエッセンス, from: 2026-11-14}
      - {text: フタ, note: さっぱりしたければシカ / 乾いていればHAクリーム}
    why: 攻めは何もしない日。この回復日があるから攻めの日が効く。

# 曜日ごとの夜
week:
  mon: rs
  tue: acid_nose
  wed: retinol
  thu: rest
  fri: rs
  sat: acid_face
  sun: rest

morning:
  steps:
    - 洗顔
    - 極潤
    - {text: GGエッセンス, from: 2026-11-14}
    - BoJ ナイアシンアミド
    - {text: ニキビの箇所だけ Neutrogena, note: 顔全体に塗らない}
    - {text: 日焼け止め, note: 必須・毎日}
  note: >-
    ビタミンC美容液を入れるときは、ナイアシンアミドと日替わりにする。
    日焼け止めを塗らないと、酸とレチノールを使っている肌はかえって毛穴・シミが悪化する。

body:
  daily:
    title: 毎日
    steps:
      - {text: 背中・胸を RS ボディウォッシュで洗う, note: なくなったら Some By Mi ボディクレンザーに替える}
      - {text: ワキ・足・首の後ろはクリアレックスで洗う}
      - 風呂上がりにトーンオンローションでフタ
    note: 背中で泡を30秒〜1分置いてから流すと効きやすい。ヒリついたら Some By Mi とクリアレックスを1日おきに。
  mist:
    title: 週1〜2回だけ ウォッシュオフミストの日
    steps:
      - お風呂の最初に「乾いた」背中・首に吹く
      - {text: 5〜10分置く, note: その間に髪・顔を洗う}
      - {text: 背中はクリアレックスで洗い流す, note: 攻めを重ねないため、この日は Some By Mi を使わない}
      - 風呂上がりにローション
    note: 濡れた肌に吹くと効果が薄まるので、必ずお風呂の一番最初に。
  spot: ポツッとできたら、寝る前にスポットパッチ(頓服ケア参照)。

# これから足すもの。1つ足したら1週間は様子を見る(合わないものがあったとき「犯人」がすぐわかる)
plan:
  - from: 2026-11-07
    what: 土曜の酸を Some By Mi トナーで顔全体に
    watch: 頬の赤み・ヒリつき・皮むけ
  - from: 2026-11-14
    what: GGエッセンス(グリシルグリシン)を朝晩に追加
    watch: 頬の毛穴の目立ち方。判断は2ヶ月続けてから
  - from: 2026-12
    what: 肌が落ち着いていれば、日曜もレチノールの夜に(週2)
    watch: 乾燥・皮むけ。出たら週1に戻す。木曜の休みは必ず残す
  - from: いつでも
    what: 朝にビタミンCを日替わりで導入(任意)
    watch: ナイアシンアミドと同じ朝に重ねない
  - from: 慣れたら
    what: リードルショットを300へ
    watch: 2〜3週間様子見。700は300に完全に慣れてから

spot_care:
  - state: 白・黄ニキビ
    sign: 白い頭(膿)が見えている
    action: >-
      夜、洗顔後にスポットパッチを貼って寝る→翌朝はがす。頭が残っていたら夜ごとに繰り返す。
      絶対に潰さない。パッチの上や下にクリーム類は塗らない(パッチ単独で)。
  - state: 赤ニキビ
    sign: 赤く腫れて痛いが、頭はまだ見えない
    action: >-
      Neutrogena(過酸化ベンゾイル)をその箇所だけ薄く、朝晩。パッチは吸うものがないので効きにくい。
      頭が出てきたらパッチに切り替え(BPOとパッチの同時併用はしない)。
  - state: 皮下のしこり
    sign: 皮膚の下に硬い塊。頭がまったくない。押すと痛い
    action: >-
      市販ケアではほぼ歯が立たない。押したり潰したりは厳禁(高確率で跡になる)。
      Neutrogena を薄く塗って触らずに待つ。2週間以上残る・強く痛む・繰り返すなら皮膚科へ。
spot_care_notes:
  - できている間、その部位と周辺には リードルショット・酸・レチノール を乗せない。夜のローテ自体は続けてOK、患部だけ避ける
  - 潰す・針でつつく・1日に何度も洗うのは全部逆効果。「触らない」が最強の頓服

reset:
  - 赤み・ヒリつき・皮むけが出たら → 攻めを全部止める
  - 3日間「洗顔 → 極潤 → シカフルイド」だけで過ごす
  - 落ち着いたら、止める前の半分の頻度から再開
  - 1週間たっても治らない・悪化する場合は皮膚科へ(使っているものを持っていくと話が早い)

never:
  - Life-flo レチノール1%は当面使わない。1%は上級者向けで皮むけ必至。Advanced Clinicals で3ヶ月慣らしてから(または背中用に回す)
  - Neutrogena(過酸化ベンゾイル)は布を漂白する。枕カバー・タオルは白に。塗ったら手を洗う
  - 毛穴パック・指で押し出すのはやらない。詰まりは数日で戻り、毛穴が広がる
  - リードルショット・酸・レチノールを同じ夜に重ねない(週の表の通りなら重ならない)

goals:
  - area: 鼻
    text: 酸+ナイアシンアミド+日焼け止めを2ヶ月続けて「詰まりが取れて目立たない」状態へ。詰まりは数日〜数週間で戻るので、続けることが大事
  - area: 頬
    text: 皮脂で開いている分は2〜3ヶ月で目立たなくなる。ハリ不足でしずく型になっている分はレチノールで3〜6ヶ月以上。毛穴の形そのものは市販ケアでは変わらない(変えたいなら美容皮膚科)
  - area: 背中
    text: 毎日続けて2〜4週間で変化が出はじめる

inventory:
  - role: 浸透・攻め
    items: リードルショット 100 / 300 / 700
  - role: 角質・酸
    items: Stridex マキシマム(BHA2%)、Some By Mi AHA・BHA・PHA 30デイズ ミラクルトナー(マイルド)
  - role: レチノール
    items: Advanced Clinicals(こちらを使う)、Life-flo 1%(封印)
  - role: ニキビ
    items: Neutrogena(過酸化ベンゾイル2.5%)、スポットパッチ
  - role: ブースター
    items: KISO GGエッセンス No.015(グリシルグリシン6%)、BoJ ナイアシンアミド、Advanced Clinicals ビタミンC
  - role: 水分(化粧水)
    items: 極潤
  - role: フタ・鎮静
    items: Scinic シカフルイド、カクタスオールインワンジェル(どちらか1つでOK)
  - role: フタ・保湿
    items: Advanced Clinicals HAクリーム
  - role: 日焼け止め
    items: ビオレUV など(大事なのは毎日塗ること)
  - role: 体
    items: RS ボディウォッシュ / ウォッシュオフミスト / トーンオンローション、Some By Mi ボディクレンザー、クリアレックス、Medix 5.5(使い方は未定)
